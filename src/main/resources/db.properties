# Configuracion de respaldo utilizada unicamente si el DataSource JNDI
# (definido en META-INF/context.xml) no puede resolverse, por ejemplo al
# ejecutar clases fuera de Apache Tomcat. En produccion se recomienda usar
# siempre el DataSource JNDI administrado por el servidor.
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/ea_taller_lubribr?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&characterEncoding=UTF-8
db.user=ea_taller_app
db.password=CAMBIAR_PASSWORD
